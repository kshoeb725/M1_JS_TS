<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Name : <input type="text" id="name" name="">
    <br>
    <br>
    password : <input type="text" id="pass" name="">
    <br>
    <br>
    Email : <input type="text" id="email" name="">
    <br>
    <br>
    <br>
    Query : <input type="text" id="query" name="">
    <br>
    <button id="b1">Submit</button>


    <script>
        const b1 = document.getElementById("b1");
        b1.addEventListener("click",()=>{
            const name = document.getElementById("name").value;
            const nameReg = /^[A-Za-z]+$/;

            const email = document.getElementById("email").value;
            const EmailReg = /^[^@\s]+@[^\s@]+\.[^\s@]+$/

            const pass = document.getElementById("pass").value;
            const passReg = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[\d])[A-Za-z\d]{8,15}$/;
            
            
            if (!nameReg.test(name)) {
                alert("Enter valid name");
            } else if(!EmailReg.test(email)){
                alert("enter a valid email")
            }else if(!passReg.test(pass)){
                alert("enter a valid Password")
            }else{
                alert("Ok")
            }
        })

        const user={
            name,pass,email
        }

        localStorage.setItem("data",JSON.stringify(user))
    </script>
</body>
</html>
