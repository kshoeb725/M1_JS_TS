<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dark {
            background-color: black;
        }
        body {
            background-color: aqua;
        }
    </style>
</head>
<body>

    <span id="icon" onclick="toggle()">😊</span>

    <script>
        function toggle() {
            // Fixed the spelling from 'toogle' to 'toggle'
            document.body.classList.toggle("dark");
        }
    </script>
</body>
</html>
