<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dark{
            background-color: black;
        }
        body{
            background-color: aqua;
            
        }

    </style>
</head>
<body>
   
    <span  id ="icon" onclick="toogle()">😊</span>

    <script>
        function toogle(){
           document.body.classList.toogle("dark")

        }
        

    </script>
</body>
</html>
